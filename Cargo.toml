[package]
name = "fleet"
version = "0.2.0"
edition = "2024"
default-run = "fleet"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
# The GUI draws on the GPU (wgpu: Metal on macOS, Vulkan on Linux), and on the CPU (tiny-skia) where no GPU adapter
# is usable; `ICED_BACKEND=tiny-skia` forces the CPU.
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "canvas", "crisp", "web-colors"], optional = true }
iced-m3 = { version = "=0.1.0-beta.5", default-features = false, optional = true }
iroh = "=1.3.0"
iroh-blobs = "=0.103.1"
libc = "0.2.190"
rand = "0.10.3"
regex = "1.13.1"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"], optional = true }
redb = { version = "=4.3.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["control-plane"]
# The desktop GUI (`fleet gui`); agents do not need it.
gui = ["dep:iced", "dep:iced-m3", "control-plane"]
# Replicated control plane, enabled in normal builds.
control-plane = ["dep:openraft", "dep:redb"]

[[bin]]
name = "fleet-control-lab"
path = "src/bin/fleet-control-lab.rs"
required-features = ["control-plane"]

[dev-dependencies]
# Renders the GUI headlessly in its tests (`cargo test --features gui`).
iced_test = "=0.14.0"

[[bin]]
name = "fleet"
path = "src/main.rs"
required-features = ["control-plane"]
