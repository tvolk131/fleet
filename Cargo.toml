[package]
name = "fleet"
version = "0.2.0"
edition = "2024"
default-run = "fleet"

[workspace]
members = ["crates/fleet-guest", "crates/fleet-tools"]
default-members = [".", "crates/fleet-guest"]

[dependencies]
fleet-guest = { path = "crates/fleet-guest" }
anyhow = "1.0.104"
blake3 = "1.8.7"
futures-lite = "2.6.1"
clap = { version = "4.6.7", features = ["derive"] }
# The GUI draws on the GPU (wgpu: Metal on macOS, Vulkan on Linux), and on the CPU (tiny-skia) where no GPU adapter
# is usable; `ICED_BACKEND=tiny-skia` forces the CPU.
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "canvas", "crisp", "web-colors"], optional = true }
iced-m3 = { version = "=0.1.0-beta.5", default-features = false, optional = true }
iroh = "=1.3.0"
iroh-blobs = "=0.103.1"
libc = "0.2.190"
rand = "0.10.3"
regex = "1.13.1"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"], optional = true }
redb = { version = "=4.3.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.2", features = ["full"] }
base64 = "0.22.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Virtualization.framework, used only by the `vz` driver's runner (`fleet-runner-vz`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL", "NSError", "NSFileHandle", "NSObject", "NSValue", "NSData"] }
objc2-virtualization = "0.3.2"

[features]
default = ["control-plane"]
# Fixture executables are excluded from normal product builds.
qualification = []
# The desktop GUI (`fleet gui`); agents do not need it.
gui = ["dep:iced", "dep:iced-m3", "control-plane"]
# Replicated control plane, enabled in normal builds.
control-plane = ["dep:openraft", "dep:redb"]

[[bin]]
name = "fleet-guest"
path = "src/bin/fleet-guest.rs"

[[bin]]
name = "fleet-runner-vz"
path = "src/bin/fleet-runner-vz.rs"

[[bin]]
name = "fleet-test-workload"
path = "tests/fixtures/workload.rs"
required-features = ["qualification"]

[[bin]]
name = "fleet-fake-tart"
path = "tests/fixtures/fake_tart.rs"
required-features = ["qualification"]

[dev-dependencies]
iroh-relay = { version = "=1.3.0", features = ["server"] }
# Renders the GUI headlessly in its tests (`cargo test --features gui`).
iced_test = "=0.14.0"

[[bin]]
name = "fleet"
path = "src/main.rs"
required-features = ["control-plane"]
