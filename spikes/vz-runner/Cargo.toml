[package]
name = "vz-runner-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike, deliberately outside the Fleet workspace.
[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSError", "NSFileHandle", "NSObject", "NSValue", "NSData"] }
objc2-virtualization = "0.3"
