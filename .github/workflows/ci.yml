name: Fleet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit bash enables -eo pipefail; tee must never hide a failing test.
    shell: bash

concurrency:
  group: fleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
      ICED_BACKEND: tiny-skia
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev libfontconfig1-dev libegl1-mesa-dev
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Build Fleet and control-plane qualification tools
        run: cargo build --all-features --bins --locked
      - name: Checkpoint backup and restore JSON CLI lifecycle with isolated Tart backend
        run: |
          python3 contrib/qualify_checkpoint_tart.py --fake --backup-restore --binary "$PWD/target/debug/fleet" \
            --home /tmp/fleet-control-checkpoint-ci 2>&1 | tee checkpoint-client.log
      - name: Rust tests (including Raft, redb, workers, and headless M3 GUI)
        run: cargo test --all-features --locked --no-fail-fast -- --test-threads=2 2>&1 | tee rust-tests.log
      - name: Clippy
        run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - name: JSON CLI contracts and fixture safeguards
        run: python3 -m unittest discover -s contrib -p 'test_*.py' -v 2>&1 | tee python-tests.log
      - name: Three-replica CLI/service failure scenarios
        run: |
          python3 contrib/qualify_normal_multihost.py --local --binary "$PWD/target/debug/fleet" \
            --home /tmp/fleet-control-ci --port 29300 2>&1 | tee local-three.log
      - name: Collect safe evidence
        if: always()
        run: |
          mkdir -p ci-evidence
          cp *.log ci-evidence/ 2>/dev/null || true
          if [ -f /tmp/fleet-control-ci/qualification.json ]; then
            cp /tmp/fleet-control-ci/qualification.json ci-evidence/
          fi
          if [ -f /tmp/fleet-control-checkpoint-ci/qualification.json ]; then
            cp /tmp/fleet-control-checkpoint-ci/qualification.json ci-evidence/checkpoint-qualification.json
          fi
          # Never upload fixture homes: they contain private identity keys and databases.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: ci-evidence/
          retention-days: 14
