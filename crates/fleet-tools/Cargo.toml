[package]
name = "fleet-tools"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fleet = { path = "../.." }
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
iroh-blobs = "=0.103.1"
redb = "=4.3.0"
serde_json = "1.0.151"
rand = "0.10.3"
sha2 = "0.10.9"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
fleet-guest = { path = "../fleet-guest" }
tokio = { version = "1.53.2", features = ["full"] }

[[bin]]
name = "fleet-import-baseline"
path = "src/import.rs"

[[bin]]
name = "fleet-qualify"
path = "../../contrib/rust/main.rs"

[dev-dependencies]
iroh = "=1.3.0"
